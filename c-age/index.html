<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age check · Lab 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="topbar-wrap">
  <header class="topbar">
    <a class="brand" href="../index.php"><span class="logo">10</span>PHP Lab <small>· Web Technology</small></a>
    <a class="crumb" href="../index.php"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>All programs</a>
  </header>
</div>
<main class="narrow">
  <span class="eyebrow">Program c · $_POST</span>
  <h1>Before you enter</h1>
  <p class="lede">This plain HTML form posts your name and age to <code>check.php</code>.</p>

  <div class="card">
    <form action="check.php" method="post">
      <div class="field">
        <label for="name">Name</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
          <input type="text" id="name" name="name" maxlength="60" autocomplete="name" placeholder="e.g. Ravi" required>
        </div>
      </div>
      <div class="field">
        <label for="age">Age</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>
          <input type="number" id="age" name="age" min="0" max="150" inputmode="numeric" placeholder="e.g. 19" required aria-describedby="age-help">
        </div>
        <span class="help" id="age-help">You must be 18 or older to visit the site.</span>
      </div>
      <button class="btn block" type="submit">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
        Check &amp; enter
      </button>
    </form>
  </div>
</main>
</body>
</html>
